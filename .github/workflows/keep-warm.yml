name: Keep API warm

# Render's free plan sleeps after 15 idle minutes, and waking takes ~50 seconds.
# Pinging the health check every 10 minutes keeps the first answer fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://fundfacts-api-heax.onrender.com/api/health
